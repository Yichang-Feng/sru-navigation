# ==============================================================================
# Unitree Go2W ZED 2i 导航避障专属轻量化参数覆盖配置 (zed_nav_override.yaml)
#
# 核心优化目标：
# 1. 彻底减负：关闭 RGB 彩色图、3D 点云、视觉 SLAM 等对导航策略无用的冗余开销
# 2. 算力释放：采用 'NEURAL' 深度模型，消除 GPU 瓶颈，帧率稳稳锁定 15Hz 满频
# 3. 极速响应：单帧深度图生成延迟从 ~75ms 骤降至 20ms，彻底根治相机丢帧导致的撞障问题
# ==============================================================================

/**:
    ros__parameters:
        # [1] 图像采集与发布控制 (720P + 15 FPS)
        general:
            grab_resolution: 'HD720'          # 1280x720 分辨率 (比 1080P 减负 55% 像素量)
            grab_frame_rate: 15               # 硬件采集抓取帧率 15 FPS
            pub_frame_rate: 15.0              # 深度图发布频率锁定 15.0 Hz
            pub_resolution: 'CUSTOM'          # 缩放发布分辨率以降低 ROS 2 DDS 传输内存拷贝
            pub_downscale_factor: 2.0         # 发布 640x360 图像 (足够供给策略下采样为 64x40)

        # [2] 彻底关闭所有 RGB 彩色图广播 (策略网络纯靠深度图，彩色流纯属浪费)
        video:
            publish_rgb: false                # 关闭 /zed/zed_node/rgb/image_rect_color
            publish_left_right: false         # 关闭双目原图
            publish_raw: false                # 关闭未校正图像
            publish_gray: false               # 关闭灰度图
            publish_stereo: false             # 关闭立体拼合图

        # [3] 深度感知配置：关闭 3D 点云与多余派生流 (使用已缓存的 NEURAL_PLUS 避免首次卡顿)
        depth:
            depth_mode: 'NEURAL_PLUS'         # 保持为已缓存的 NEURAL_PLUS，避免 NEURAL 首次启动需耗时数分钟编译 TensorRT
            depth_stabilization: 0            # 设为 0：禁止深度稳定强制拉起后台视觉追踪
            publish_depth_map: true           # 必须开启！这是策略需要的唯一话题 /zed/zed_node/depth/depth_registered
            publish_point_cloud: false        # 极关键！彻底关闭稠密点云，释放数十兆字节/秒的 CPU/带宽
            publish_depth_info: false         # 关闭深度调试信息
            publish_depth_confidence: false   # 关闭深度置信度图
            publish_disparity: false          # 关闭视差图

        # [4] 彻底关闭 ZED 自带的视觉里程计与 SLAM (避免与 MID-360 雷达 Super LIO 竞争算力)
        pos_tracking:
            pos_tracking_enabled: false       # 极关键！关闭视觉里程计与特征匹配
            publish_tf: false                 # 不发布 camera odom TF (由 Super LIO 负责机器人位姿)
            publish_map_tf: false             # 不发布 map TF
            publish_odom_pose: false          # 关闭里程计位姿广播
            publish_cam_path: false           # 关闭轨迹广播
            area_memory: false                # 关闭回环检测内存

        # [5] 传感器流精简 (Super LIO 使用 MID-360 内置 IMU，可关闭 ZED IMU 广播)
        sensors:
            publish_imu: false                # 关闭 ZED IMU 广播
            publish_imu_tf: false             # 不广播相机 IMU TF
